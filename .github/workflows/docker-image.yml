name: Build and push Docker image

on:
  workflow_dispatch:

concurrency:
  group: dockerhub-nginx-proxy-manager-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: docker.io/moailaozi/nginx-proxy-manager

jobs:
  quality:
    name: Semantic config quality gate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: |
            backend/yarn.lock
            frontend/yarn.lock

      - name: Install Yarn
        run: npm install --global yarn@1.22.22

      - name: Verify release version sources
        run: node scripts/set-version.mjs --check

      - name: Validate backend schemas, catalog, lint, and tests
        working-directory: backend
        run: |
          yarn install --frozen-lockfile --network-timeout 600000
          yarn validate-schema
          yarn check:proxy-directives
          yarn lint
          yarn test

      - name: Validate real requests against OpenResty 1.31.1.1
        run: node scripts/test-nginx-live.mjs

      - name: Upload real Nginx request results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nginx-live-results
          path: backend/coverage/nginx-live/results.json
          if-no-files-found: warn

      - name: Validate frontend catalog coverage, types, locales, tests, and build
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile --network-timeout 600000
          yarn lint
          yarn locale-compile
          yarn vitest run --no-color
          yarn build

  build-and-push:
    needs: quality
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read and validate image version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/dev" ]]; then
            echo "Stable images must be published from the dev branch."
            exit 1
          fi
          VERSION="$(tr -d '[:space:]' < .version)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo ".version must use major.minor.patch format (for example: 1.3.1)."
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          echo "full=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=$MAJOR.$MINOR" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"

      - name: Set build metadata
        id: metadata
        shell: bash
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date --utc '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build, runtime-validate, and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.full }}
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.minor }}
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.major }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.full }}
            BUILD_COMMIT=${{ steps.metadata.outputs.commit }}
            BUILD_DATE=${{ steps.metadata.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
