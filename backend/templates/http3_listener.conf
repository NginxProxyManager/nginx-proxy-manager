# HTTP/3 wildcard socket owner. Generated only while an enabled HTTP/3 proxy host exists.
server {
  listen 443 quic reuseport default_server;
{% if ipv6 -%}
  listen [::]:443 quic reuseport default_server;
{% endif %}

  server_name _;
  ssl_reject_handshake on;
  access_log off;
  error_log /dev/null crit;

  return 444;
}
