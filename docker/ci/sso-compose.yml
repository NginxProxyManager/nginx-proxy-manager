services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: npm
      POSTGRES_PASSWORD: sso-test-only
      POSTGRES_DB: npm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U npm"]
      interval: 2s
      timeout: 2s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: sso-test-root
      MYSQL_DATABASE: npm
      MYSQL_USER: npm
      MYSQL_PASSWORD: sso-test-only
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-unpm", "-psso-test-only", "--silent"]
      interval: 2s
      timeout: 2s
      retries: 45

  oidc:
    image: npm-sso-fixture:task15
    user: "0:0"
    build: ../../test/ssofixtures
    command: ["--allow-non-loopback", "--listen", "0.0.0.0:9443", "--protocol", "oidc", "--issuer-url", "https://idp-oidc.test:9443", "--client-id", "npm-oidc", "--client-secret", "oidc-secret", "--cert-out", "/certs/oidc.crt", "--key-out", "/certs/oidc.key"]
    volumes: ["fixture-certs:/certs"]
    ports: ["9443:9443"]
    networks:
      default:
        aliases: ["idp-oidc.test"]

  oauth2:
    image: npm-sso-fixture:task15
    user: "0:0"
    build: ../../test/ssofixtures
    command: ["--allow-non-loopback", "--listen", "0.0.0.0:9444", "--protocol", "oauth2", "--issuer-url", "https://idp-oauth.test:9444", "--client-id", "npm-oauth", "--client-secret", "oauth-secret", "--cert-out", "/certs/oauth.crt", "--key-out", "/certs/oauth.key"]
    volumes: ["fixture-certs:/certs"]
    ports: ["9444:9444"]
    networks:
      default:
        aliases: ["idp-oauth.test"]

  saml:
    image: npm-sso-fixture:task15
    user: "0:0"
    build: ../../test/ssofixtures
    command: ["--allow-non-loopback", "--listen", "0.0.0.0:9445", "--protocol", "saml", "--issuer-url", "https://idp-saml.test:9445", "--sp-entity-id", "https://npm.test/sso/sp", "--acs-url", "https://npm.test:8443/sso/*", "--cert-out", "/certs/saml.crt", "--key-out", "/certs/saml.key"]
    volumes: ["fixture-certs:/certs"]
    ports: ["9445:9445"]
    networks:
      default:
        aliases: ["idp-saml.test"]

  cert-bundle:
    image: alpine/openssl:3.5.4
    entrypoint: ["/bin/sh", "-ec"]
    depends_on: [oidc, oauth2, saml]
    volumes: ["fixture-certs:/certs"]
    command:
      - >-
        for f in oidc.crt oauth.crt saml.crt; do until test -s /certs/$$f; do sleep 1; done; done;
        cat /certs/oidc.crt /certs/oauth.crt /certs/saml.crt > /certs/provider-ca-bundle.pem;
        openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=npm.test -addext subjectAltName=DNS:npm.test -keyout /certs/npm.key -out /certs/npm.crt

  npm1: &npm
    image: npm-sso-task15
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    environment:
      NPM_DB_DRIVER: ${SSO_DB_DRIVER:-postgres}
      NPM_DB_HOST: ${SSO_DB_HOST:-postgres}
      NPM_DB_PORT: ${SSO_DB_PORT:-5432}
      NPM_DB_USERNAME: npm
      NPM_DB_PASSWORD: sso-test-only
      NPM_DB_NAME: npm
      NPM_DB_SSLMODE: disable
      NPM_LOG_LEVEL: debug
      NPM_DISABLE_IPV6: "true"
      SSL_CERT_FILE: /sso-certs/provider-ca-bundle.pem
    depends_on:
      cert-bundle:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
    volumes:
      - npm-data:/data
      - fixture-certs:/sso-certs:ro
    ports: ["3081:3000"]

  npm2:
    <<: *npm
    ports: ["3082:3000"]

  edge:
    image: nginx:1.29-alpine
    depends_on: [npm1]
    volumes:
      - fixture-certs:/certs:ro
      - ./sso-nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["8443:443"]
    networks:
      default:
        aliases: ["npm.test"]

volumes:
  fixture-certs:
  npm-data:
