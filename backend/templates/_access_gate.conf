{%- if access_gate %}

  # Sign-in pages and credential checks for access lists using security keys or tokens
  location ^~ /.npm-auth/check/ {
    internal;
    proxy_pass              http://127.0.0.1:3000/access-gate/check/;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";
    proxy_set_header        X-NPM-Gate-Host      $host;
    proxy_set_header        X-NPM-Gate-Authority $http_host;
    {% if trust_forwarded_proto == true %}
    proxy_set_header        X-NPM-Gate-Proto     $x_forwarded_proto;
    {% else %}
    proxy_set_header        X-NPM-Gate-Proto     $scheme;
    {% endif %}
  }

  location ^~ /.npm-auth/ {
    proxy_pass              http://127.0.0.1:3000/access-gate/;
    proxy_set_header        X-NPM-Gate-Host      $host;
    proxy_set_header        X-NPM-Gate-Authority $http_host;
    {% if trust_forwarded_proto == true %}
    proxy_set_header        X-NPM-Gate-Proto     $x_forwarded_proto;
    {% else %}
    proxy_set_header        X-NPM-Gate-Proto     $scheme;
    {% endif %}
    proxy_set_header        X-NPM-Gate-URI       $request_uri;
    proxy_set_header        X-Real-IP            $remote_addr;
  }
{%- endif -%}
