{% include "_header_comment.conf" %}

{% if enabled %}

{% if upstream_servers.size > 0 %}
upstream npm-{{ id }} {
  zone npm-{{ id }} 64k;
  {% if lb_method == "least_conn" %}least_conn;{% elsif lb_method == "ip_hash" %}ip_hash;{% endif %}
  {% for server in upstream_servers %}
  server {{ server.host }}:{{ server.port }} weight={{ server.weight }} max_fails={{ server.max_fails }} fail_timeout={{ server.fail_timeout }}{% if server.resolve %} resolve{% endif %}{% if server.backup %} backup{% endif %}{% if server.down %} down{% endif %};
  {% endfor %}
}
{% endif %}

{% include "_hsts_map.conf" %}

server {
  set $forward_scheme {{ forward_scheme }};
  set $server         "{{ forward_host }}";
  set $port           {{ forward_port }};
{% if upstream_servers.size > 0 %}
  set $lb_upstream    "npm-{{ id }}";
{% endif %}

{% include "_listen.conf" %}
{% include "_certificates.conf" %}
{% include "_assets.conf" %}
{% include "_exploits.conf" %}
{% include "_hsts.conf" %}
{% include "_forced_ssl.conf" %}

{% if allow_websocket_upgrade == 1 or allow_websocket_upgrade == true %}
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $http_connection;
proxy_http_version 1.1;
{% endif %}

  access_log /data/logs/proxy-host-{{ id }}_access.log proxy;
  error_log /data/logs/proxy-host-{{ id }}_error.log warn;

{{ advanced_config }}

{{ locations }}

{% if use_default_location %}

  location / {

{% include "_access.conf" %}
{% include "_hsts.conf" %}

    {% if allow_websocket_upgrade == 1 or allow_websocket_upgrade == true %}
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    {% endif %}

    {% if upstream_servers.size > 0 %}
    # Proxy to the load balancing upstream group
    include conf.d/include/proxy-upstream.conf;
    {% else %}
    # Proxy!
    include conf.d/include/proxy.conf;
    {% endif %}
  }
{% endif %}

  # Custom
  include /data/nginx/custom/server_proxy[.]conf;
}
{% endif %}
