events {}
http {
	server {
		listen 443 ssl;
		server_name npm.test;
		ssl_certificate /certs/npm.crt;
		ssl_certificate_key /certs/npm.key;
		add_header Referrer-Policy no-referrer always;
		location / {
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-Proto https;
			proxy_pass http://npm1:3000;
		}
	}
}
