{% if certificate and certificate_id > 0 and ssl_forced %}
    # npm:feature field=ssl_forced source=user begin
    # Force SSL (expanded)
    {% if trust_forwarded_proto == true %}
    set $trust_forwarded_proto "T";
    {% else %}
    set $trust_forwarded_proto "F";
    {% endif %}
    set $test "";
    if ($scheme = "http") {
      set $test "H";
    }
    if ($request_uri = /.well-known/acme-challenge/test-challenge) {
      set $test "${test}T";
    }

    # Check whether SSL has already been handled by a trusted forwarding proxy.
    set $test_ssl_handled "";
    if ($trust_forwarded_proto = "") {
      set $trust_forwarded_proto "F";
    }
    if ($trust_forwarded_proto = "T") {
      set $test_ssl_handled "${test_ssl_handled}T";
    }
    if ($http_x_forwarded_proto = "https") {
      set $test_ssl_handled "${test_ssl_handled}S";
    }
    if ($http_x_forwarded_scheme = "https") {
      set $test_ssl_handled "${test_ssl_handled}S";
    }
    if ($test_ssl_handled = "TSS") {
      set $test_ssl_handled "TS";
    }
    if ($test_ssl_handled = "TS") {
      set $test "${test}S";
    }
    if ($test = H) {
      return 301 https://$host$request_uri;
    }
    # npm:feature field=ssl_forced source=user end
{% else %}
    # npm:feature field=ssl_forced source=user value=off
{% endif %}
