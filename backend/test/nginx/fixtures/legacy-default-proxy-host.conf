# ------------------------------------------------------------
# legacy.example.test
# ------------------------------------------------------------



map $scheme $hsts_header_proxy_host_101 {
    https   "max-age=63072000; preload";
}


server {
  set $forward_scheme http;
  set $server         "127.0.0.1";
  set $port           8080;
  set $npm_host_type "proxy_host";
  set $npm_host_id "101";

  listen 80;
listen [::]:80;


  server_name legacy.example.test;
http2 off;


  # npm:feature field=certificate_id source=user value=off


  # npm:feature field=caching_enabled source=user value=off


  # npm:feature field=block_exploits source=user begin
  # Block Exploits (expanded, product-owned policy)
  ## Block SQL injections
  set $block_sql_injections 0;

  if ($query_string ~ "union.*select.*\(") {
    set $block_sql_injections 1;
  }

  if ($query_string ~ "union.*all.*select.*") {
    set $block_sql_injections 1;
  }

  if ($query_string ~ "concat.*\(") {
    set $block_sql_injections 1;
  }

  if ($block_sql_injections = 1) {
    return 403;
  }

  ## Block file injections
  set $block_file_injections 0;

  if ($query_string ~ "[a-zA-Z0-9_]=http://") {
    set $block_file_injections 1;
  }

  if ($query_string ~ "[a-zA-Z0-9_]=(\.\.//?)+") {
    set $block_file_injections 1;
  }

  if ($query_string ~ "[a-zA-Z0-9_]=/([a-z0-9_.]//?)+") {
    set $block_file_injections 1;
  }

  if ($block_file_injections = 1) {
    return 403;
  }

  ## Block common exploits
  set $block_common_exploits 0;

  if ($query_string ~ "(<|%3C).*script.*(>|%3E)") {
    set $block_common_exploits 1;
  }

  if ($query_string ~ "GLOBALS(=|\[|\%[0-9A-Z]{0,2})") {
    set $block_common_exploits 1;
  }

  if ($query_string ~ "_REQUEST(=|\[|\%[0-9A-Z]{0,2})") {
    set $block_common_exploits 1;
  }

  if ($query_string ~ "proc/self/environ") {
    set $block_common_exploits 1;
  }

  if ($query_string ~ "mosConfig_[a-zA-Z_]{1,21}(=|\%3D)") {
    set $block_common_exploits 1;
  }

  if ($query_string ~ "base64_(en|de)code\(.*\)") {
    set $block_common_exploits 1;
  }

  if ($block_common_exploits = 1) {
    return 403;
  }

  ## Block spam
  set $block_spam 0;

  if ($query_string ~ "\b(ultram|unicauca|valium|viagra|vicodin|xanax|ypxaieo)\b") {
    set $block_spam 1;
  }

  if ($query_string ~ "\b(erections|hoodia|huronriveracres|impotence|levitra|libido)\b") {
    set $block_spam 1;
  }

  if ($query_string ~ "\b(ambien|blue\spill|cialis|cocaine|ejaculation|erectile)\b") {
    set $block_spam 1;
  }

  if ($query_string ~ "\b(lipitor|phentermin|pro[sz]ac|sandyauer|tramadol|troyhamby)\b") {
    set $block_spam 1;
  }

  if ($block_spam = 1) {
    return 403;
  }

  ## Block user agents
  set $block_user_agents 0;

  # Disable Akeeba Remote Control 2.5 and earlier
  if ($http_user_agent ~ "Indy Library") {
    set $block_user_agents 1;
  }

  # Common bandwidth hoggers and hacking tools.
  if ($http_user_agent ~ "libwww-perl") {
    set $block_user_agents 1;
  }

  if ($http_user_agent ~ "GetRight") {
    set $block_user_agents 1;
  }

  if ($http_user_agent ~ "GetWeb!") {
    set $block_user_agents 1;
  }

  if ($http_user_agent ~ "Go!Zilla") {
    set $block_user_agents 1;
  }

  if ($http_user_agent ~ "Download Demon") {
    set $block_user_agents 1;
  }

  if ($http_user_agent ~ "Go-Ahead-Got-It") {
    set $block_user_agents 1;
  }

  if ($http_user_agent ~ "TurnitinBot") {
    set $block_user_agents 1;
  }

  if ($http_user_agent ~ "GrabNet") {
    set $block_user_agents 1;
  }

  if ($block_user_agents = 1) {
    return 403;
  }
  # npm:feature field=block_exploits source=user end



  # npm:feature field=hsts_enabled source=user value=off



    # npm:feature field=ssl_forced source=user value=off



  access_log /data/logs/proxy-host-101_access.log proxy;
  access_log /data/logs/npm-monitor-http.log npm_proxy_metrics_v1 buffer=128k flush=1s;
  error_log /data/logs/proxy-host-101_error.log warn;







  location / {

    # Location-level access_log overrides the server scope, so keep both logs.
    access_log /data/logs/proxy-host-101_access.log proxy;
    access_log /data/logs/npm-monitor-http.log npm_proxy_metrics_v1 buffer=128k flush=1s;


    # npm:feature field=access_list_id source=user value=off



  # npm:feature field=hsts_enabled source=user value=off



    # Product-owned proxy policy. Do not rely on nginx or include-file defaults.
    # npm:managed proxy-option-profile=npm-explicit-proxy-v1
    client_max_body_size 2000m;
    proxy_connect_timeout 90s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;
    proxy_next_upstream_timeout 0;
    proxy_buffer_size 8k;
    proxy_busy_buffers_size 16k;
    proxy_max_temp_file_size 1024m;
    proxy_temp_file_write_size 16k;
    proxy_limit_rate 0;
    proxy_headers_hash_bucket_size 64;
    proxy_headers_hash_max_size 512;
    proxy_next_upstream_tries 0;
    proxy_ssl_verify_depth 1;
    proxy_buffering on;
    proxy_request_buffering on;
    proxy_ignore_client_abort off;
    proxy_intercept_errors off;
    proxy_force_ranges off;
    proxy_pass_request_body on;
    proxy_pass_request_headers on;
    proxy_pass_trailers off;
    proxy_socket_keepalive off;
    proxy_ssl_server_name off;
    proxy_ssl_session_reuse on;
    proxy_ssl_verify off;
    proxy_buffers 8 8k;
    proxy_http_version 1.1;
    proxy_method $request_method;
    proxy_bind off;
    proxy_next_upstream error timeout;
    proxy_ssl_name $proxy_host;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_ssl_ciphers DEFAULT;
    proxy_cookie_domain off;
    proxy_cookie_path off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $x_forwarded_proto;
    proxy_set_header X-Forwarded-Scheme $x_forwarded_scheme;
    proxy_set_header X-Real-IP $remote_addr;
    # npm:feature field=caching_enabled source=derived begin
    # Explicitly disable proxy cache for the default managed Location.
    proxy_cache off;
    proxy_cache_bypass 0;
    proxy_no_cache 0;
    # npm:feature field=caching_enabled source=derived end
    add_header X-Served-By $host;
    proxy_pass $forward_scheme://$server:$port$request_uri;
    proxy_redirect off;
  }


  # Custom
  include /data/nginx/custom/server_proxy[.]conf;
}
