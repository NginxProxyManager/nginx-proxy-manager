server {
	listen 8080;
	root /usr/share/nginx/html;

	location /api/ {
		# nginx resolves this once at startup and caches the address. If you
		# recreate the backend container it will get a new address, so restart
		# this one too:  docker compose restart npmui
		proxy_pass http://npmbackend:3000/;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location / {
		try_files $uri /index.html;
	}
}
