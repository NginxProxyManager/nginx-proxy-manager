{% include "_header_comment.conf" %}

{% if enabled %}

{% include "_hsts_map.conf" %}

server {
  set $forward_scheme {{ forward_scheme }};
  set $server         "{{ forward_host }}";
  set $port           {{ forward_port }};
  set $npm_host_type "proxy_host";
  set $npm_host_id "{{ id }}";

{% include "_listen.conf" %}
{% include "_certificates.conf" %}
{% include "_assets.conf" %}
{% include "_exploits.conf" %}
{% include "_hsts.conf" %}
{% include "_forced_ssl.conf" %}

{% if allow_websocket_upgrade == 1 or allow_websocket_upgrade == true %}
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $http_connection;
proxy_http_version 1.1;
{% endif %}

  access_log /data/logs/proxy-host-{{ id }}_access.log proxy;
  access_log /data/logs/npm-monitor-http.log npm_proxy_metrics_v1 buffer=128k flush=1s;
  error_log /data/logs/proxy-host-{{ id }}_error.log warn;

{% if nginx_options %}
{{ nginx_options }}
{% endif %}

{{ advanced_config }}

{{ locations }}

{% if use_default_location %}

  location / {

    # Location-level access_log overrides the server scope, so keep both logs.
    access_log /data/logs/proxy-host-{{ id }}_access.log proxy;
    access_log /data/logs/npm-monitor-http.log npm_proxy_metrics_v1 buffer=128k flush=1s;

{% include "_access.conf" %}
{% include "_hsts.conf" %}

    {% if allow_websocket_upgrade == 1 or allow_websocket_upgrade == true %}
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    {% endif %}

    # Proxy!
{% if use_managed_request_headers %}    add_header X-Served-By $host;
    proxy_pass $forward_scheme://$server:$port$request_uri;{% else %}    include conf.d/include/proxy.conf;{% endif %}{{ "\n" }}
{% if use_managed_request_headers %}{{ managed_nginx_location_options | prepend: "    " | replace: "\n", "\n    " }}{% elsif nginx_options %}{{ nginx_options | prepend: "    " | replace: "\n", "\n    " }}{% endif %}{{ "\n" }}
  }
{% endif %}

  # Custom
  include /data/nginx/custom/server_proxy[.]conf;
}
{% endif %}
