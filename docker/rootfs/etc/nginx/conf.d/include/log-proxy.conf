# Declare variables at http scope so log_format can reference them before a
# per-server `set` assigns the proxy-host identity.
map $host $npm_host_type {
	default "";
}

map $host $npm_host_id {
	default "";
}

log_format npm_proxy_metrics_v1 escape=json
  '{'
    '"v":1,'
    '"ts":"$msec",'
    '"host_type":"$npm_host_type",'
    '"host_id":"$npm_host_id",'
    '"synthetic":"$npm_synthetic",'
    '"method":"$request_method",'
    '"status":"$status",'
    '"request_length":"$request_length",'
    '"bytes_sent":"$bytes_sent",'
    '"body_bytes_sent":"$body_bytes_sent",'
    '"request_time":"$request_time",'
    '"request_completion":"$request_completion",'
    '"connection_requests":"$connection_requests",'
    '"pipe":"$pipe",'
    '"scheme":"$scheme",'
    '"server_protocol":"$server_protocol",'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_connect_time":"$upstream_connect_time",'
    '"upstream_header_time":"$upstream_header_time",'
    '"upstream_response_time":"$upstream_response_time",'
    '"upstream_response_length":"$upstream_response_length",'
    '"upstream_bytes_sent":"$upstream_bytes_sent",'
    '"upstream_bytes_received":"$upstream_bytes_received",'
    '"cache_status":"$upstream_cache_status",'
    '"gzip_ratio":"$gzip_ratio",'
    '"ssl_protocol":"$ssl_protocol",'
    '"ssl_cipher":"$ssl_cipher",'
    '"ssl_session_reused":"$ssl_session_reused"'
  '}';

map $http_x_npm_monitor $npm_synthetic {
	default 0;
	"1" 1;
}

log_format proxy '[$time_local] $upstream_cache_status $upstream_status $status - $request_method $scheme $host "$request_uri" [Client $remote_addr] [Length $body_bytes_sent] [Gzip $gzip_ratio] [Sent-to $server] "$http_user_agent" "$http_referer"';
log_format standard '[$time_local] $status - $request_method $scheme $host "$request_uri" [Client $remote_addr] [Length $body_bytes_sent] [Gzip $gzip_ratio] "$http_user_agent" "$http_referer"';

access_log /data/logs/fallback_http_access.log proxy;
