# ------------------------------------------------------------
# {{ incoming_port }} TCP: {{ tcp_forwarding }} UDP: {{ udp_forwarding }}{% if meta.dynamic_resolve == 0 or meta.dynamic_resolve == false %} DynamicResolve: false{% elsif meta.dynamic_resolve == 1 or meta.dynamic_resolve == true %} DynamicResolve: true{% endif %}
# ------------------------------------------------------------

{% if enabled %}
{% if tcp_forwarding == 1 or tcp_forwarding == true -%}
server {
  listen {{ incoming_port }} reuseport {%- if certificate %} ssl {%- endif %};
  {% unless ipv6 -%} # {%- endunless -%} listen [::]:{{ incoming_port }} reuseport {%- if certificate %} ssl {%- endif %};

  {%- include "_certificates_stream.conf" %}

  {% if dynamic_resolve == 1 or dynamic_resolve == true -%}
  set $forward_host "{{ forwarding_host }}:{{ forwarding_port }}";
  proxy_pass $forward_host;
  {% else -%}
  proxy_pass {{ forwarding_host }}:{{ forwarding_port }};
  {% endif -%}

  access_log /data/logs/stream-{{ id }}_access.log stream;
  error_log /data/logs/stream-{{ id }}_error.log warn;

  # Custom
  include /data/nginx/custom/server_stream[.]conf;
  include /data/nginx/custom/server_stream_tcp[.]conf;
}
{% endif %}

{% if udp_forwarding == 1 or udp_forwarding == true -%}
server {
  listen {{ incoming_port }} udp reuseport;
  {% unless ipv6 -%} # {%- endunless -%} listen [::]:{{ incoming_port }} udp reuseport;

  {% if dynamic_resolve == 1 or dynamic_resolve == true -%}
  set $forward_host "{{ forwarding_host }}:{{ forwarding_port }}";
  proxy_pass $forward_host;
  {% else -%}
  proxy_pass {{ forwarding_host }}:{{ forwarding_port }};
  {% endif -%}

  access_log /data/logs/stream-{{ id }}_access.log stream;
  error_log /data/logs/stream-{{ id }}_error.log warn;

  # Custom
  include /data/nginx/custom/server_stream[.]conf;
  include /data/nginx/custom/server_stream_udp[.]conf;
}
{% endif %}
{% endif %}
