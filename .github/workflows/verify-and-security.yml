name: Verify And Security Checks

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-backend:
    name: Verify Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Backend lint and schema validation
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/backend:/app" \
            -w /app \
            nginxproxymanager/nginx-full:certbot-node \
            sh -c "yarn install --frozen-lockfile && yarn lint . && yarn validate-schema && rm -rf node_modules"

  verify-frontend:
    name: Verify Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Frontend lint, tests, and build
        run: |
          docker run --rm \
            -e CI=true \
            -e NODE_OPTIONS=--openssl-legacy-provider \
            -v "$GITHUB_WORKSPACE/frontend:/app/frontend" \
            -w /app/frontend \
            nginxproxymanager/nginx-full:certbot-node \
            sh -c "yarn install --frozen-lockfile && yarn lint && yarn locale-compile && yarn vitest run --no-color && yarn build && rm -rf node_modules src/locale/lang"

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  security-dependencies:
    name: Security Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit backend dependencies
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/backend:/app" \
            -w /app \
            nginxproxymanager/nginx-full:certbot-node \
            sh -c "yarn install --frozen-lockfile && yarn audit --level high && rm -rf node_modules"

      - name: Audit frontend dependencies
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/frontend:/app/frontend" \
            -w /app/frontend \
            nginxproxymanager/nginx-full:certbot-node \
            sh -c "yarn install --frozen-lockfile && yarn audit --level high && rm -rf node_modules src/locale/lang"

  security-secrets:
    name: Security Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-image:
    name: Build And Publish Image
    runs-on: ubuntu-latest
    needs:
      - verify-backend
      - verify-frontend
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Set image name
        id: vars
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set build date
        id: build_date
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TARGETPLATFORM=linux/amd64
            BUILD_VERSION=${{ github.ref_name }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build_date.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
