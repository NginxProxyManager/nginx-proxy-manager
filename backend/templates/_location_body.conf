{%- comment -%}
  The body of a custom location. _location_assets.conf repeats it in the nested asset location
  (npm_asset_copy: true), so assets go through the same advanced config, access list and proxy settings.
  With npm_asset_inherit (the advanced config has a top-level include, see assetAdvancedConfig()) the copy sets
  no proxy_set_header / add_header / access / websocket / proxy_redirect lines: it inherits the location's, the included ones too.
  npm_asset_uri_var: the copy's rewrite changes $uri, the later-phase statements of the copy of the advanced config
  read this variable instead: set to $uri before anything else runs and again right before the copy's rewrite, after
  the user's own rewrite-phase statements (which read $uri itself), see keepUriVariables() in lib/nginx-locations.js.
{%- endcomment -%}
{%- if npm_asset_copy and npm_asset_uri_var != "" %}
    set {{ npm_asset_uri_var }} $uri;
{%- endif %}
{%- if npm_dynamic %}
    # Resolved by nginx per request, see "Custom locations" in the docs
    set {{ npm_host_var }} "{{ forward_host }}";
{%- endif %}
    # npm-location-advanced-begin {{ npm_index }}
{%- if npm_asset_copy %}
    {{ npm_asset_advanced_config }}
{%- else %}
    {{ advanced_config }}
{%- endif %}
    # npm-location-advanced-end {{ npm_index }}
{%- unless npm_asset_copy and npm_asset_inherit %}

    proxy_set_header Host $forward_host;
    proxy_set_header X-Forwarded-Scheme $scheme;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-For    $remote_addr;
    proxy_set_header X-Real-IP		$remote_addr;
{%- endunless %}

{%- if npm_asset_copy %}
{%- if npm_asset_rewrite != "" %}
{%- if npm_asset_uri_var != "" %}
    set {{ npm_asset_uri_var }} $uri;
{%- endif %}
    rewrite {{ npm_asset_rewrite }} break;
{%- endif %}
    proxy_pass {{ forward_scheme }}://{{ npm_upstream }}:{{ forward_port }}{{ npm_asset_uri }};
{%- if npm_asset_redirect != "" %}
    proxy_redirect {{ npm_asset_redirect }};
{%- endif %}
{%- elsif npm_dynamic %}
{%- if npm_rewrite != "" %}
    rewrite          {{ npm_rewrite }} break;
{%- endif %}
    proxy_pass       {{ forward_scheme }}://{{ npm_host_var }}:{{ forward_port }};
{%- if npm_redirect != "" %}
    proxy_redirect   {{ npm_redirect }};
{%- endif %}
{%- else %}
    proxy_pass       {{ forward_scheme }}://{{ forward_host }}:{{ forward_port }}{{ forward_path }};
{%- endif %}

{%- unless npm_asset_copy and npm_asset_inherit %}
    {% include "_access.conf" %}
{%- endunless %}
{%- unless npm_asset_copy %}
    {% include "_location_assets.conf" %}
{%- endunless %}
    {% include "_exploits.conf" %}
    {% include "_forced_ssl.conf" %}
{%- unless npm_asset_copy and npm_asset_inherit %}
    {% include "_hsts.conf" %}

    {% if allow_websocket_upgrade == 1 or allow_websocket_upgrade == true %}
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    {% endif %}
{%- endunless %}
