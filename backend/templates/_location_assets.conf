{% if npm_assets -%}
    # Asset Caching, same as conf.d/include/assets.conf (including its cache key: the forwarded Host with
    # the client's port, so host:8443 and host:9443 don't share entries) but it behaves like this location
    # itself: a nested location runs none of the set / if / return / rewrite lines of its parent, so it repeats
    # the location's body (advanced config, access list, proxy settings, see _location_body.conf). A cache
    # directive the advanced config sets itself is left out here, the location's value applies. With a top-level
    # `include` in the advanced config the includes and list settings (proxy_set_header, add_header, ...) are
    # inherited, not repeated, and it sets no redirect rule of its own.
    # The group is non-capturing so the parent's captures ($1 in the forward path) are kept.
    location ~* ^.*\.(?:css|js|jpe?g|gif|png|webp|woff|woff2|eot|ttf|svg|ico|css\.map|js\.map)$ {
{%- unless npm_asset_own.if_modified_since %}
      if_modified_since off;
{%- endunless %}

      # use the public cache
{%- unless npm_asset_own.proxy_cache %}
      proxy_cache public-cache;
{%- endunless %}
{%- unless npm_asset_own.proxy_cache_key %}
      proxy_cache_key $forward_host$request_uri;
{%- endunless %}

      # ignore these headers for media
{%- unless npm_asset_own.proxy_ignore_headers %}
      proxy_ignore_headers Set-Cookie Cache-Control Expires X-Accel-Expires;
{%- endunless %}

      # cache 200s and also 404s (not ideal but there are a few 404 images for some reason)
      proxy_cache_valid any 30m;
      proxy_cache_valid 404 1m;

      # strip this header to avoid If-Modified-Since requests
      proxy_hide_header Last-Modified;
      proxy_hide_header Cache-Control;
      proxy_hide_header Vary;

      proxy_cache_bypass 0;
      proxy_no_cache 0;

{%- unless npm_asset_own.proxy_cache_use_stale %}
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504 http_404;
{%- endunless %}
{%- unless npm_asset_own.proxy_connect_timeout %}
      proxy_connect_timeout 5s;
{%- endunless %}
{%- unless npm_asset_own.proxy_read_timeout %}
      proxy_read_timeout 45s;
{%- endunless %}

{%- unless npm_asset_own.expires %}
      expires @30m;
{%- endunless %}
{%- unless npm_asset_own.access_log %}
      access_log  off;
{%- endunless %}
{%- include "_location_body.conf", npm_asset_copy: true %}
    }
{% endif %}
