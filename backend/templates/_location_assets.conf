{% if npm_assets -%}
    # Asset Caching, same as conf.d/include/assets.conf (including its cache key: the forwarded Host with
    # the client's port, so host:8443 and host:9443 don't share entries) but proxied to this location's
    # upstream. A nested location does not inherit the set/rewrite of its parent, so they are repeated here.
    # It inherits the parent's proxy_set_header lines (Host $forward_host), it sets none of its own.
    location ~* ^.*\.(css|js|jpe?g|gif|png|webp|woff|woff2|eot|ttf|svg|ico|css\.map|js\.map)$ {
      if_modified_since off;

      # use the public cache
      proxy_cache public-cache;
      proxy_cache_key $forward_host$request_uri;

      # ignore these headers for media
      proxy_ignore_headers Set-Cookie Cache-Control Expires X-Accel-Expires;

      # cache 200s and also 404s (not ideal but there are a few 404 images for some reason)
      proxy_cache_valid any 30m;
      proxy_cache_valid 404 1m;

      # strip this header to avoid If-Modified-Since requests
      proxy_hide_header Last-Modified;
      proxy_hide_header Cache-Control;
      proxy_hide_header Vary;

      proxy_cache_bypass 0;
      proxy_no_cache 0;

      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504 http_404;
      proxy_connect_timeout 5s;
      proxy_read_timeout 45s;

      expires @30m;
      access_log  off;
{%- if npm_dynamic %}
      set {{ npm_host_var }} "{{ forward_host }}";
{%- endif %}
{%- if npm_asset_rewrite != "" %}
      rewrite {{ npm_asset_rewrite }} break;
{%- endif %}
      proxy_pass {{ forward_scheme }}://{{ npm_upstream }}:{{ forward_port }}{{ npm_asset_uri }};
      proxy_redirect {{ npm_asset_redirect }};
    }
{% endif %}
