# Access list sign-in cookies (npm_gate_<id>) stay between the browser and NPM.
# They're set for the whole host, so every proxied location removes them, however many there are.
set_by_lua_block $npm_upstream_cookie {
	local cookie = ngx.var.http_cookie
	if not cookie or not cookie:find("npm_gate_", 1, true) then
		return cookie or ""
	end
	local kept = {}
	for part in cookie:gmatch("[^;]+") do
		local trimmed = part:match("^%s*(.-)%s*$")
		if trimmed ~= "" and not trimmed:match("^npm_gate_%d+=") then
			kept[#kept + 1] = trimmed
		end
	end
	return table.concat(kept, "; ")
}
proxy_set_header Cookie $npm_upstream_cookie;
