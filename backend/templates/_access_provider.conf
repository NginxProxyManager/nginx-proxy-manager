{% if access_list_id > 0 %}
{% if access_list.provider_auth == 1 or access_list.provider_auth == true %}
  # Supporting locations for provider backed authorization. These have to sit at
  # server level, while the auth_request that uses them is inside each location.

  location = /_npm_access_check {
    internal;
    # $npm_access_list is set by whichever location is being protected, so one
    # pair of blocks serves every location on this server.
    proxy_pass              http://127.0.0.1:3000/access-lists/$npm_access_list/verify;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";
    proxy_set_header        X-Original-URI $request_uri;
    proxy_set_header        X-Original-Remote-Addr $remote_addr;
  }

  location @npm_access_challenge {
    add_header WWW-Authenticate $npm_auth_challenge always;
    return 401;
  }
{% endif %}
{% endif %}
