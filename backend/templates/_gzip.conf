{% if gzip_enabled == 1 or gzip_enabled == true -%}
  # Response Compression
  gzip on;
  gzip_comp_level {{ gzip_comp_level }};
  gzip_vary on;
  gzip_proxied any;
{% if gzip_types != empty -%}
  gzip_types {{ gzip_types | join: " " }};
{% endif %}
{% else -%}
  # Response Compression
  gzip off;
{% endif %}
