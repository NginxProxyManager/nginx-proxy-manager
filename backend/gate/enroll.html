<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex, nofollow" />
		<title>Register a security key</title>
		<link rel="stylesheet" href="/.npm-auth/assets/gate.css" />
		<script src="/.npm-auth/assets/gate.js" defer></script>
	</head>
	<body data-page="enroll">
		<main class="card">
			<p class="brand">Nginx Proxy Manager</p>
			<h1 id="title">Register a security key</h1>
			<p id="subtitle" class="muted"></p>

			<div id="status" class="status" role="status" aria-live="polite" hidden></div>
			<p id="loading" class="muted">Loading…</p>

			<section id="key-section" hidden>
				<button id="key-button" type="button" class="button primary">Register security key</button>
				<p id="key-hint" class="hint">Insert your key and touch it, or hold it to the back of your phone.</p>
			</section>

			<section id="done-section" hidden>
				<a id="continue-link" class="button primary" href="/">Continue to site</a>
			</section>
		</main>
	</body>
</html>
