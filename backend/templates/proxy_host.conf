{% include "_header_comment.conf" %}

{% if enabled %}

{% if upstream_servers.size > 0 %}
upstream npm-{{ id }} {
  {% if lb_method == "least_conn" %}least_conn;
  {% endif %}
  {% if lb_method == "ip_hash" %}ip_hash;
  {% endif %}
  {% for server in upstream_servers %}
  server {{ server.host }}:{{ server.port }}{% if server.weight > 1 %} weight={{ server.weight }}{% endif %} max_fails={{ server.max_fails }} fail_timeout={{ server.fail_timeout }}{% if server.backup %} backup{% endif %}{% if server.down %} down{% endif %};
  {% endfor %}
}
{% endif %}

{% include "_hsts_map.conf" %}

server {
{% if upstream_servers.size > 0 %}
  set $forward_scheme {{ forward_scheme }};
  set $server         "npm-{{ id }}";
{% else %}
  set $forward_scheme {{ forward_scheme }};
  set $server         "{{ forward_host }}";
  set $port           {{ forward_port }};
{% endif %}

{% include "_listen.conf" %}
{% include "_certificates.conf" %}
{% include "_assets.conf" %}
{% include "_exploits.conf" %}
{% include "_hsts.conf" %}
{% include "_forced_ssl.conf" %}

{% if allow_websocket_upgrade == 1 or allow_websocket_upgrade == true %}
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $http_connection;
proxy_http_version 1.1;
{% endif %}

  access_log /data/logs/proxy-host-{{ id }}_access.log proxy;
  error_log /data/logs/proxy-host-{{ id }}_error.log warn;

{{ advanced_config }}

{{ locations }}

{% if use_default_location %}

  location / {

{% include "_access.conf" %}
{% include "_hsts.conf" %}

    {% if allow_websocket_upgrade == 1 or allow_websocket_upgrade == true %}
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    {% endif %}

    {% if upstream_servers.size > 0 %}
    add_header       X-Served-By $host;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Scheme $x_forwarded_scheme;
    proxy_set_header X-Forwarded-Proto  $x_forwarded_proto;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_pass       {{ forward_scheme }}://npm-{{ id }};
    {% else %}
    # Proxy!
    include conf.d/include/proxy.conf;
    {% endif %}
  }
{% endif %}

  # Custom
  include /data/nginx/custom/server_proxy[.]conf;
}
{% endif %}
