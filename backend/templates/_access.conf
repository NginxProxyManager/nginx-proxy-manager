{% if access_list_id > 0 %}
    {% if access_list.provider_auth == 1 or access_list.provider_auth == true %}
    # Authorization, checked against the authentication providers this list
    # accepts. A directory will not give up password hashes, so these accounts
    # cannot live in a htpasswd file; nginx asks the backend per request instead.
    set $npm_access_list {{ access_list_id }};
    auth_request /_npm_access_check;

    # Carry the challenge back from the subrequest, so the browser prompts.
    # It is empty for a 401 coming from the proxied application itself, and
    # nginx omits a header with an empty value, so those pass through untouched.
    auth_request_set $npm_auth_challenge $upstream_http_www_authenticate;
    auth_request_set $npm_auth_user $upstream_http_x_auth_user;
    error_page 401 = @npm_access_challenge;

    {% elsif access_list.items.length > 0 %}
    # Authorization
    auth_basic            "Authorization required";
    auth_basic_user_file  /data/access/{{ access_list_id }};

    {% endif %}
    {% if access_list.provider_auth == 1 or access_list.provider_auth == true or access_list.items.length > 0 %}
    {% if access_list.pass_auth == 0 or access_list.pass_auth == false %}
    proxy_set_header Authorization "";
    {% endif %}

    {% endif %}

    {% if access_list.clients.length > 0 %}
    # Access Rules: {{ access_list.clients | size }} total
    {% for client in access_list.clients %}
    {{client | nginxAccessRule}}
    {% endfor %}
    deny all;
    {% endif %}

    # Access checks must...
    {% if access_list.satisfy_any == 1 or access_list.satisfy_any == true %}
    satisfy any;
    {% else %}
    satisfy all;
    {% endif %}
{% endif %}
