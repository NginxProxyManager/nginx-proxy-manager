{% if certificate and certificate_id > 0 and ssl_forced and hsts_enabled %}
  # npm:feature field=hsts_enabled source=user begin
  # HSTS (ngx_http_headers_module is required; 63072000 seconds = 2 years)
  add_header Strict-Transport-Security $hsts_header_{{ hsts_variable }} always;
  # npm:feature field=hsts_enabled source=user end
{% else %}
  # npm:feature field=hsts_enabled source=user value=off
{% endif %}
